<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
توزيع الخطة على الأسابيع
</title>


<style>

body{

font-family:Tahoma;
background:#f3f4f6;
padding:20px;

}


.card{

background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px #ddd;

}


select,input,button{

padding:10px;
margin:5px;

}


button{

background:#2563eb;
color:white;
border:0;
border-radius:6px;
cursor:pointer;

}


table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}


th,td{

border:1px solid #ddd;
padding:8px;
text-align:center;

}


th{

background:#2563eb;
color:white;

}


</style>

</head>


<body>



<div class="card">


<h2>
توزيع الخطة الأسبوعية
</h2>



<label>
اختر الخطة
</label>


<select id="planSelect">

<option>
تحميل...
</option>

</select>



<br>


<label>
عدد أسابيع الفصل
</label>


<input 
id="weeksCount"
type="number"
value="16">



<button id="auto">

توزيع تلقائي

</button>



<button id="save">

حفظ التوزيع

</button>




<div id="result"></div>



</div>







<script type="module">


import {

protectPage

}

from "./auth.js";



import {

getDatabase,
ref,
get,
update,
child

}

from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";





protectPage([
"Manager"
]);



const db=getDatabase();



let currentPlan=null;

let distribution={};







async function loadPlans(){


const snap=
await get(
child(ref(db),"plans")
);



const select=
document.getElementById(
"planSelect"
);



select.innerHTML="";



if(!snap.exists())
return;



Object.keys(snap.val())
.forEach(id=>{


let p=snap.val()[id];



let option=
document.createElement("option");


option.value=id;


option.textContent=

`${p.grade} - ${p.subject}`;


select.appendChild(option);



});



currentPlan=
select.value;



}



document
.getElementById("planSelect")
.onchange=e=>{

currentPlan=e.target.value;

};









// التوزيع التلقائي


document
.getElementById("auto")
.onclick=async()=>{


if(!currentPlan)
return;



const snap=
await get(
ref(db,"plans/"+currentPlan)
);



const plan=snap.val();



let lessons=[];



Object.values(plan.weeks || {})
.forEach(w=>{


w.lessons.forEach(l=>{

lessons.push(l);

});


});





let weeks=
Number(
document.getElementById("weeksCount").value
);




distribution={};




lessons.forEach((lesson,index)=>{


let week=

Math.floor(
(index/weeks)
)+1;



if(!distribution[week])
distribution[week]=[];



distribution[week].push(lesson);



});




showDistribution();


};









function showDistribution(){



let html=

`

<table>


<tr>

<th>
الأسبوع
</th>

<th>
الأهداف
</th>


</tr>

`;



Object.keys(distribution)
.forEach(w=>{


html+=`

<tr>

<td>

الأسبوع ${w}

</td>



<td>

${

distribution[w]
.map(
x=>x.description
)
.join("<br>")

}

</td>


</tr>


`;



});



html+="</table>";



document
.getElementById("result")
.innerHTML=html;


}










// حفظ التوزيع


document
.getElementById("save")
.onclick=async()=>{


if(!currentPlan)
return;



await update(

ref(
db,
"plans/"+currentPlan
),

{

distributedWeeks:
distribution

}

);



alert(
"تم حفظ التوزيع"
);



};






loadPlans();



</script>


</body>

</html>
