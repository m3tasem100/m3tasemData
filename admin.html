<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
UCA Admin Dashboard
</title>


<style>

*{
box-sizing:border-box;
font-family:Tahoma,Arial;
}

body{

margin:0;

background:#f1f5f9;

}


.header{

background:#1e3a8a;

color:white;

padding:20px;

display:flex;

justify-content:space-between;

align-items:center;

}


.header h1{

margin:0;

font-size:24px;

}


.container{

padding:25px;

}



.card{

background:white;

border-radius:15px;

padding:25px;

margin-bottom:20px;

box-shadow:0 5px 20px rgba(0,0,0,.12);

}



h2{

color:#1e3a8a;

margin-top:0;

}



.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:15px;

}



label{

font-weight:bold;

display:block;

margin-bottom:6px;

}



input,select{

width:100%;

padding:12px;

border:1px solid #cbd5e1;

border-radius:8px;

font-size:15px;

}



button{

border:0;

padding:12px 20px;

border-radius:8px;

cursor:pointer;

font-weight:bold;

}



.primary{

background:#2563eb;

color:white;

width:100%;

}



.logout{

background:#dc2626;

color:white;

}



table{

width:100%;

border-collapse:collapse;

margin-top:15px;

}



th{

background:#1e3a8a;

color:white;

padding:12px;

}



td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



.message{

margin-top:15px;

font-weight:bold;

}



.success{

color:green;

}



.error{

color:red;

}



</style>

</head>


<body>



<div class="header">


<h1>
🏫 UCA School Management System
</h1>


<button class="logout" id="logoutBtn">

تسجيل الخروج

</button>


</div>






<div class="container">



<div class="card">


<h2>
بيانات المدير
</h2>


<div class="grid">


<div>
الاسم:
<strong id="adminName"></strong>
</div>


<div>
البريد:
<strong id="adminEmail"></strong>
</div>


<div>
الدور:
<strong id="adminRole"></strong>
</div>


</div>


</div>







<div class="card">


<h2>
إضافة مستخدم جديد
</h2>



<div class="grid">


<div>

<label>
الاسم
</label>

<input id="newName">

</div>



<div>

<label>
البريد الإلكتروني
</label>

<input id="newEmail" type="email">

</div>



<div>

<label>
كلمة المرور
</label>

<input id="newPassword" type="password">

</div>



<div>

<label>
الدور
</label>


<select id="newRole">


<option value="Teacher">
معلم
</option>


<option value="Head">
رئيس قسم
</option>


<option value="Coordinator">
منسق
</option>


<option value="StageManager">
مدير مرحلة
</option>


<option value="Viewer">
مشاهد
</option>


<option value="Manager">
مدير
</option>


</select>


</div>


</div>



<br>


<button class="primary" id="createUserBtn">

إنشاء المستخدم

</button>



<div id="message" class="message"></div>


</div>








<div class="card">


<h2>
قائمة المستخدمين
</h2>


<table>


<thead>

<tr>

<th>
الاسم
</th>


<th>
البريد
</th>


<th>
الدور
</th>


<th>
الحالة
</th>


</tr>

</thead>


<tbody id="usersTable">


</tbody>


</table>


</div>






</div>









<script type="module">


import {

protectPage,

currentUser,

logout,

createUser

}

from "./auth.js";



import {

db

}

from "./firebase-config.js";



import {

ref,

get

}

from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";






// حماية الصفحة


protectPage([

"Manager"

]);







const admin =
currentUser();



if(admin){


adminName.textContent =
admin.name || "-";


adminEmail.textContent =
admin.email || "-";


adminRole.textContent =
admin.role || "-";


}








logoutBtn.onclick=()=>{

logout();

};









async function loadUsers(){


const snapshot =
await get(
ref(db,"users")
);



usersTable.innerHTML="";



if(!snapshot.exists()){


usersTable.innerHTML=

`
<tr>
<td colspan="4">
لا يوجد مستخدمون
</td>
</tr>
`;

return;

}



const users =
snapshot.val();





Object.keys(users).forEach(uid=>{


const u =
users[uid];



usersTable.innerHTML +=


`

<tr>

<td>
${u.name || ""}
</td>


<td>
${u.email || ""}
</td>


<td>
${u.role || ""}
</td>


<td>
${u.active ? "فعال":"موقوف"}
</td>


</tr>

`;


});



}





loadUsers();









createUserBtn.onclick =
async()=>{


message.className="message";


try{


await createUser({

name:newName.value.trim(),

email:newEmail.value.trim(),

password:newPassword.value,

role:newRole.value


});



message.className="message success";

message.innerHTML =
"تم إنشاء المستخدم بنجاح";



newName.value="";
newEmail.value="";
newPassword.value="";



loadUsers();


}

catch(error){


message.className="message error";

message.innerHTML =
error.message;


}



};




</script>


</body>

</html>
