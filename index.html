<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
UCA School Management System
</title>


<style>

*{
box-sizing:border-box;
font-family:Tahoma,Arial,sans-serif;
}


body{

margin:0;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:
linear-gradient(135deg,#0f172a,#1d4ed8,#38bdf8);

}


.login-box{

width:390px;

background:white;

padding:35px;

border-radius:20px;

box-shadow:0 20px 50px rgba(0,0,0,.3);

}



.logo{

text-align:center;

margin-bottom:25px;

}



.logo .icon{

font-size:55px;

}



.logo h1{

margin:5px;

color:#1e3a8a;

font-size:25px;

}



.logo p{

color:#64748b;

}



label{

display:block;

font-weight:bold;

margin-bottom:7px;

color:#334155;

}



.input{

width:100%;

padding:13px;

margin-bottom:18px;

border-radius:10px;

border:1px solid #cbd5e1;

font-size:15px;

outline:none;

}



.input:focus{

border-color:#2563eb;

}



.password-container{

position:relative;

}



.password-container span{

position:absolute;

left:15px;

top:12px;

cursor:pointer;

font-size:20px;

}



button{

width:100%;

padding:14px;

border:0;

border-radius:10px;

background:#2563eb;

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;

}



button:hover{

background:#1d4ed8;

}



button:disabled{

background:#94a3b8;

}



#message{

margin-top:15px;

text-align:center;

font-size:14px;

color:#dc2626;

}



.loading{

display:none;

text-align:center;

margin-top:15px;

color:#2563eb;

}



.footer{

margin-top:25px;

text-align:center;

color:#64748b;

font-size:13px;

}


</style>


</head>



<body>



<div class="login-box">



<div class="logo">

<div class="icon">
🏫
</div>

<h1>
UCA
</h1>

<h1>
School Management System
</h1>

<p>
تسجيل الدخول إلى النظام
</p>

</div>





<label>
البريد الإلكتروني
</label>


<input

class="input"

id="email"

type="email"

placeholder="example@school.com"

>




<label>
كلمة المرور
</label>



<div class="password-container">


<input

class="input"

id="password"

type="password"

placeholder="********"

>



<span id="showPassword">
👁
</span>



</div>






<button id="loginBtn">

تسجيل الدخول

</button>



<div class="loading" id="loading">

جاري تسجيل الدخول...

</div>



<div id="message"></div>




<div class="footer">

UCA School Management System © 2026

</div>


</div>








<script type="module">


import { login }

from "./auth.js";





const btn =
document.getElementById("loginBtn");

const msg =
document.getElementById("message");

const loading =
document.getElementById("loading");






btn.addEventListener(
"click",
async()=>{


msg.innerHTML="";


btn.disabled=true;

loading.style.display="block";



try{


await login();



}

catch(error){


msg.innerHTML =
error.message;


}



finally{


btn.disabled=false;

loading.style.display="none";


}


}

);








// Enter key


document.addEventListener(
"keydown",
(e)=>{


if(e.key==="Enter"){

btn.click();

}


});








// Show password


document
.getElementById("showPassword")
.onclick=function(){


const pass =
document.getElementById("password");



if(pass.type==="password"){

pass.type="text";

this.innerHTML="🙈";

}

else{

pass.type="password";

this.innerHTML="👁";

}


};



</script>



</body>

</html>
