<!DOCTYPE html>

<html lang="ar" dir="rtl">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
UCA Admin Dashboard
</title>


<link rel="stylesheet" href="style.css">


</head>




<body>


<div class="app">





<!-- SIDEBAR -->

<aside class="sidebar">


<div class="logo">


<h2>
🏫 UCA
</h2>


<p>
مدير النظام
</p>


</div>







<button onclick="goPage('admin_dashboard.html')">

🏠 الرئيسية

</button>






<button onclick="goPage('users.html')">

👥 المستخدمون

</button>






<button onclick="goPage('departments.html')">

🏢 الأقسام

</button>






<button onclick="goPage('subjects.html')">

📚 المواد

</button>






<button onclick="goPage('grades.html')">

🎓 الصفوف

</button>






<button onclick="goPage('upload_plans.html')">

📂 رفع الخطط

</button>






<button onclick="goPage('plan_distribution.html')">

📅 توزيع الأسابيع

</button>






<button onclick="goPage('reports.html')">

📊 التقارير

</button>






<button onclick="goPage('settings.html')">

⚙️ الإعدادات

</button>







<button id="logoutBtn" class="logout">

🚪 تسجيل الخروج

</button>




</aside>









<!-- MAIN -->


<main class="main">



<header class="header">



<div>


<h2>

لوحة المدير

</h2>


<p id="adminInfo">

</p>


</div>




</header>








<section class="content">





<div class="cards">






<div class="card"
onclick="goPage('users.html')">


<h3>

👥 المستخدمون

</h3>


<p>

إدارة المستخدمين والصلاحيات

</p>


</div>







<div class="card"
onclick="goPage('upload_plans.html')">


<h3>

📂 الخطط

</h3>


<p>

رفع وإدارة الخطط الدراسية

</p>


</div>







<div class="card"
onclick="goPage('plan_distribution.html')">


<h3>

📅 التوزيع

</h3>


<p>

توزيع الأهداف على الأسابيع

</p>


</div>







<div class="card"
onclick="goPage('reports.html')">


<h3>

📊 التقارير

</h3>


<p>

تقارير النظام

</p>


</div>






</div>





</section>





</main>






</div>









<script type="module">


import {

protectPage,
currentUser,
logout

}

from "./auth.js";






protectPage([

"Manager"

]);







const user=currentUser();





if(user){


document

.getElementById("adminInfo")

.innerHTML=

`

الاسم:
${user.name}


<br>


البريد:
${user.email}


<br>


الدور:
${user.role}

`;



}








document

.getElementById("logoutBtn")

.onclick=

logout;








window.goPage=function(page){


location.href=page;


};




</script>




</body>


</html>
