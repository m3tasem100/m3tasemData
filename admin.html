<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
UCA Admin Dashboard
</title>


<style>

*{
box-sizing:border-box;
font-family:Tahoma,Arial;
}


body{

margin:0;

background:#f1f5f9;

}



.header{

background:#1e3a8a;

color:white;

padding:20px;

display:flex;

justify-content:space-between;

align-items:center;

}



.header h1{

margin:0;

}



button{

border:0;

padding:10px 18px;

border-radius:8px;

cursor:pointer;

}



.logout{

background:#dc2626;

color:white;

}



.container{

padding:25px;

}



.card{

background:white;

padding:20px;

border-radius:15px;

margin-bottom:20px;

box-shadow:0 5px 20px rgba(0,0,0,.1);

}



h2{

color:#1e3a8a;

}



.grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(220px,1fr));

gap:15px;

}



input,select{

width:100%;

padding:12px;

border:1px solid #cbd5e1;

border-radius:8px;

margin-bottom:12px;

}



.add{

background:#2563eb;

color:white;

width:100%;

}



table{

width:100%;

border-collapse:collapse;

}



th{

background:#1e3a8a;

color:white;

padding:12px;

}



td{

padding:12px;

text-align:center;

border-bottom:1px solid #ddd;

}



</style>

</head>



<body>



<div class="header">


<h1>
🏫 لوحة المدير - UCA
</h1>


<button class="logout" id="logoutBtn">
تسجيل الخروج
</button>


</div>





<div class="container">



<div class="card">


<h2>
بيانات المدير
</h2>


<div class="grid">


<div>
الاسم:
<strong id="adminName"></strong>
</div>


<div>
البريد:
<strong id="adminEmail"></strong>
</div>


<div>
الدور:
<strong id="adminRole"></strong>
</div>


</div>


</div>








<div class="card">


<h2>
إضافة مستخدم جديد
</h2>



<div class="grid">


<div>

<label>
الاسم
</label>

<input id="newName">


</div>



<div>

<label>
البريد الإلكتروني
</label>

<input id="newEmail" type="email">


</div>




<div>

<label>
كلمة المرور
</label>

<input id="newPassword" type="password">


</div>




<div>

<label>
الدور
</label>


<select id="newRole">


<option value="Teacher">
Teacher
</option>


<option value="Head">
Head
</option>


<option value="Coordinator">
Coordinator
</option>


<option value="StageManager">
StageManager
</option>


<option value="Viewer">
Viewer
</option>


<option value="Manager">
Manager
</option>


</select>


</div>


</div>



<button class="add" id="createUserBtn">

إنشاء المستخدم

</button>



<p id="message"></p>



</div>








<div class="card">


<h2>
المستخدمون
</h2>



<table>


<thead>

<tr>

<th>
الاسم
</th>

<th>
البريد
</th>

<th>
الدور
</th>

</tr>


</thead>


<tbody id="usersTable">


</tbody>


</table>



</div>






</div>







<script type="module">


import {

protectPage,

currentUser,

logout

}

from "./auth.js";



import {

db

}

from "./firebase-config.js";



import {

ref,

get

}

from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";






protectPage([

"Manager"

]);







const user =
currentUser();



if(user){


adminName.innerHTML =
user.name || "-";


adminEmail.innerHTML =
user.email || "-";


adminRole.innerHTML =
user.role || "-";


}







logoutBtn.onclick=()=>{

logout();

};






async function loadUsers(){



const snap =
await get(
ref(db,"users")
);



usersTable.innerHTML="";



if(!snap.exists())

return;



const users =
snap.val();




Object.values(users)
.forEach(u=>{



usersTable.innerHTML +=

`

<tr>

<td>${u.name || ""}</td>

<td>${u.email || ""}</td>

<td>${u.role || ""}</td>

</tr>

`;


});



}




loadUsers();





createUserBtn.onclick=()=>{


alert(
"سيتم تفعيل إنشاء المستخدم بعد تحديث auth.js"
);


};



</script>


</body>

</html>
