<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
Dashboard المدير
</title>


<style>

body{

font-family:Tahoma,Arial;
background:#f3f4f6;
margin:0;

}



header{

background:#1e3a8a;
color:white;
padding:15px;

display:flex;
justify-content:space-between;

}



.container{

padding:20px;

}



.cards{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(200px,1fr));

gap:20px;

}



.card{

background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 10px #ddd;

text-align:center;

}



.card h2{

color:#2563eb;

}



.section{

background:white;

padding:20px;

margin-top:20px;

border-radius:10px;

}



table{

width:100%;

border-collapse:collapse;

}



th,td{

border:1px solid #ddd;

padding:10px;

text-align:center;

}



th{

background:#2563eb;

color:white;

}



.warning{

color:red;
font-weight:bold;

}


</style>


</head>



<body>


<header>


<h2>
لوحة مدير النظام
</h2>


</header>





<div class="container">



<div class="cards">



<div class="card">

<h2 id="teachers">
0
</h2>

<p>
عدد المعلمين
</p>

</div>




<div class="card">

<h2 id="plans">
0
</h2>

<p>
عدد الخطط
</p>

</div>





<div class="card">

<h2 id="completed">
0
</h2>

<p>
الأسابيع المكتملة
</p>

</div>





<div class="card">

<h2 id="pending">
0
</h2>

<p>
أسابيع غير مؤكدة
</p>

</div>



</div>










<div class="section">


<h3>
⚠️ الأسابيع غير المؤكدة
</h3>


<div id="pendingArea">

</div>



</div>









<div class="section">


<h3>
نسبة الإنجاز حسب القسم
</h3>


<div id="sectionReport">

</div>


</div>









<div class="section">


<h3>
نسبة الإنجاز حسب المادة
</h3>


<div id="subjectReport">

</div>


</div>







</div>








<script type="module">


import {

protectPage

}

from "./auth.js";



import {

getDatabase,
get,
ref,
child

}

from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";





protectPage([
"Manager",
"Admin"
]);





const db=getDatabase();






async function loadDashboard(){



const usersSnap=
await get(
child(ref(db),"users")
);



const plansSnap=
await get(
child(ref(db),"plans")
);




let users=
usersSnap.exists()
?
usersSnap.val()
:
{};




let plans=
plansSnap.exists()
?
plansSnap.val()
:
{};







let teachers=0;



Object.values(users)
.forEach(u=>{


if(u.role==="Teacher")
teachers++;


});




document
.getElementById("teachers")
.innerHTML=teachers;




document
.getElementById("plans")
.innerHTML=
Object.keys(plans).length;








let completed=0;

let pending=0;



let pendingRows="";



let sections={};

let subjects={};







Object.keys(plans)
.forEach(id=>{



let p=plans[id];



Object.keys(
p.distributedWeeks || {}
)
.forEach(w=>{



let status=
p.weekStatus &&
p.weekStatus[w];





if(status && status.verified){


completed++;


}
else{


pending++;



pendingRows+=`

<tr>


<td>
${p.grade}
</td>


<td>
${p.subject}
</td>



<td>
الأسبوع ${w}
</td>



<td class="warning">

غير مؤكد

</td>



</tr>

`;



}






// القسم


let sec=
p.section || "غير محدد";



if(!sections[sec])

sections[sec]={
total:0,
done:0
};



sections[sec].total++;



if(status && status.verified)

sections[sec].done++;





// المادة


let sub=
p.subject || "غير محدد";



if(!subjects[sub])

subjects[sub]={
total:0,
done:0
};



subjects[sub].total++;



if(status && status.verified)

subjects[sub].done++;





});



});






document
.getElementById("completed")
.innerHTML=completed;



document
.getElementById("pending")
.innerHTML=pending;






document
.getElementById("pendingArea")
.innerHTML=

`

<table>

<tr>

<th>
الصف
</th>

<th>
المادة
</th>

<th>
الأسبوع
</th>

<th>
الحالة
</th>

</tr>

${pendingRows}

</table>

`;







showReport(
"sectionReport",
sections
);



showReport(
"subjectReport",
subjects
);



}









function showReport(element,data){



let html=

`

<table>

<tr>

<th>
الاسم
</th>


<th>
نسبة الإنجاز
</th>


</tr>

`;



Object.keys(data)
.forEach(x=>{


let percent=
data[x].total
?
(
data[x].done /
data[x].total
*100
).toFixed(1)
:
0;



html+=`

<tr>

<td>
${x}
</td>


<td>
${percent}%

</td>


</tr>


`;



});



html+="</table>";



document
.getElementById(element)
.innerHTML=html;



}







loadDashboard();



</script>


</body>

</html>
