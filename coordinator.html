<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
لوحة المنسق
</title>


<style>

body{

font-family:Tahoma,Arial;
background:#f3f4f6;
margin:0;

}


header{

background:#7c3aed;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;

}


.container{

padding:20px;

}


.card{

background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 3px 10px #ddd;

}


button{

background:#7c3aed;
color:white;
border:0;
padding:10px 15px;
border-radius:6px;
cursor:pointer;

}


table{

width:100%;
border-collapse:collapse;

}


th,td{

border:1px solid #ddd;
padding:10px;
text-align:center;

}


th{

background:#6d28d9;
color:white;

}


.readonly{

background:#eee;

}

</style>


</head>


<body>


<header>

<h2>
لوحة المنسق
</h2>


<button id="logout">
تسجيل خروج
</button>


</header>





<div class="container">



<div class="card">


<h3 id="coordName">
جاري التحميل...
</h3>


<p id="coordInfo"></p>


</div>






<div class="card">


<h3>
المعلمون والتقييمات
</h3>


<div id="teachersArea">

</div>


</div>



</div>








<script type="module">


import {

protectPage,
logout,
currentUser

}
from "./auth.js";



import {

getDatabase,
ref,
get,
set,
push,
child

}

from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";






protectPage([
"Coordinator"
]);





document
.getElementById("logout")
.onclick=logout;






const user=currentUser();


const db=getDatabase();






if(user){


document
.getElementById("coordName")
.innerHTML=

`
المنسق:
${user.name}

`;



document
.getElementById("coordInfo")
.innerHTML=

`
الأقسام:
${user.sections || "غير محدد"}

`;



}









async function loadTeachers(){



const usersSnap =
await get(
child(ref(db),"users")
);



const evalSnap =
await get(
child(ref(db),"evaluations")
);




const area =
document.getElementById(
"teachersArea"
);




if(!usersSnap.exists()){


area.innerHTML=
"لا يوجد معلمون";

return;

}




let evaluations =
evalSnap.exists()
?
evalSnap.val()
:
{};




let html=

`

<table>

<tr>

<th>
المعلم
</th>


<th>
القسم
</th>


<th>
تقييم رئيس القسم
</th>


<th>
تقييم المنسق
</th>


<th>
إجراء
</th>


</tr>

`;







Object.keys(usersSnap.val())
.forEach(id=>{


let teacher=
usersSnap.val()[id];



if(
teacher.role==="Teacher"
){



let headScore="-";



Object.values(evaluations)
.forEach(e=>{


if(
e.teacherId===id
&&
e.evaluatorRole==="Head"
){

headScore=e.score;

}


});





let coordScore="-";



Object.values(evaluations)
.forEach(e=>{


if(
e.teacherId===id
&&
e.evaluatorRole==="Coordinator"
){

coordScore=e.score;

}


});






html+=`

<tr>


<td>
${teacher.name}
</td>


<td>
${teacher.section || "-"}
</td>



<td class="readonly">

${headScore}

</td>



<td>

${coordScore}

</td>




<td>


<button onclick="evaluateTeacher('${id}','${teacher.name}')">

تقييم

</button>


</td>



</tr>


`;



}



});





html+="</table>";



area.innerHTML=html;



}











// إضافة تقييم المنسق


window.evaluateTeacher=
async function(
teacherId,
name
){



let score=
prompt(

`
تقييم المنسق للمعلم:
${name}

الدرجة من 100

`

);



if(score===null)
return;





const id=
push(
ref(db,"evaluations")
)
.key;




await set(

ref(
db,
"evaluations/"+id
),

{


teacherId:teacherId,


evaluator:user.uid,


evaluatorRole:"Coordinator",



score:Number(score),


weight:25,


year:"2025-2026",


semester:"Semester 1",


createdAt:
new Date().toISOString()


}


);






alert(
"تم حفظ تقييم المنسق"
);



loadTeachers();



}






loadTeachers();



</script>



</body>


</html>
