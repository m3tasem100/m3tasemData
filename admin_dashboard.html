<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Admin Dashboard
</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">

<h2>

</h2>

</button>



<button onclick="go('users.html')">

</button>



<button onclick="go('upload_plans.html')">

</button>




<button id="logoutBtn" class="logout">

<main class="main">

<h2>

<section class="content">



<div class="cards">



<div class="card">

<h3>

</h3>

0
</h1>

<div class="card">

<h3>
👨‍🏫 المعلمون
</h3>

0
</h1>

</div>





<div class="card">

<h3>

</h3>

</h1>

</div>





<div class="card">

📚 المواد
</h3>

<h1 id="subjectsCount">
0
</h1>

</div>





<div class="card">

<h3>
🎓 الصفوف
</h3>

0
</h1>

</div>

<h3>
📂 الخطط
</h3>

0
</h1>

</div>



</div>









<div class="card">

⚠️ أسابيع غير معتمدة
</h3>

<thead>

<tr>

<th>
المعلم
</th>

<th>

</th>

<th>
التاريخ
</th>


</tr>

</thead>

</tbody>



</table>


</div>







</section>




</main>




</div>







<script type="module" src="admin_dashboard.js"></script>

</html>
