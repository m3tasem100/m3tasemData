<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
مدير المرحلة
</title>


<style>

body{

font-family:Tahoma,Arial;
background:#f3f4f6;
margin:0;

}


header{

background:#b45309;
color:white;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;

}


.container{

padding:20px;

}


.card{

background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 3px 10px #ddd;

}


button{

background:#d97706;
color:white;
border:0;
padding:10px 15px;
border-radius:6px;
cursor:pointer;

}


table{

width:100%;
border-collapse:collapse;

}


th,td{

border:1px solid #ddd;
padding:10px;
text-align:center;

}


th{

background:#92400e;
color:white;

}


</style>


</head>


<body>


<header>


<h2>
مدير المرحلة
</h2>


<button id="logout">
تسجيل خروج
</button>


</header>





<div class="container">


<div class="card">


<h3 id="stageName">
جاري التحميل...
</h3>


<p id="stageInfo"></p>


</div>





<div class="card">


<h3>
التقييم النهائي للمعلمين
</h3>


<div id="teachersArea"></div>


</div>



</div>








<script type="module">


import {

protectPage,
logout,
currentUser

}
from "./auth.js";



import {

getDatabase,
ref,
get,
set,
push,
update,
child

}

from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";






protectPage([
"StageManager"
]);






document
.getElementById("logout")
.onclick=logout;






const user=currentUser();


const db=getDatabase();







if(user){


document
.getElementById("stageName")
.innerHTML=

`
مدير المرحلة:
${user.name}

`;



document
.getElementById("stageInfo")
.innerHTML=

`
المرحلة:
${user.stage || "-"}

`;



}









async function loadTeachers(){



const usersSnap=
await get(
child(ref(db),"users")
);



const evalSnap=
await get(
child(ref(db),"evaluations")
);




const area=
document.getElementById(
"teachersArea"
);




if(!usersSnap.exists()){

area.innerHTML=
"لا يوجد بيانات";

return;

}





let evaluations=
evalSnap.exists()
?
evalSnap.val()
:
{};





let html=

`

<table>


<tr>

<th>
المعلم
</th>


<th>
رئيس القسم 25%
</th>


<th>
المنسق 25%
</th>


<th>
مدير المرحلة 25%
</th>


<th>
المجموع الحالي
</th>


<th>
إجراء
</th>


</tr>

`;






Object.keys(usersSnap.val())
.forEach(id=>{


let teacher=
usersSnap.val()[id];



if(
teacher.role==="Teacher"
){



let head=0;

let coordinator=0;

let stage=0;




Object.values(evaluations)
.forEach(e=>{


if(e.teacherId===id){



if(e.evaluatorRole==="Head")
head=e.score;


if(e.evaluatorRole==="Coordinator")
coordinator=e.score;


if(e.evaluatorRole==="StageManager")
stage=e.score;



}



});





let total =

(
(head*0.25)
+
(coordinator*0.25)
+
(stage*0.25)

).toFixed(2);







html+=`

<tr>


<td>

${teacher.name}

</td>



<td>

${head}

</td>




<td>

${coordinator}

</td>




<td>

${stage}

</td>




<td>

${total}

</td>




<td>


<button

onclick="evaluateTeacher('${id}','${teacher.name}')"

>

تقييم

</button>


</td>



</tr>


`;



}



});





html+="</table>";



area.innerHTML=html;



}











// تقييم مدير المرحلة


window.evaluateTeacher=

async function(
teacherId,
name
){



let score=
prompt(

`
تقييم مدير المرحلة:

${name}

الدرجة من 100

`

);



if(score===null)
return;






const id=
push(
ref(db,"evaluations")
)
.key;





await set(

ref(
db,
"evaluations/"+id
),

{


teacherId:teacherId,


evaluator:user.uid,


evaluatorRole:"StageManager",



score:Number(score),


weight:25,


year:"2025-2026",


semester:"Semester 1",


createdAt:
new Date().toISOString()



}

);






alert(
"تم حفظ تقييم مدير المرحلة"
);



loadTeachers();



}







loadTeachers();



</script>


</body>


</html>
