<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UCA Admin Dashboard</title>

<style>

*{
box-sizing:border-box;
font-family:Tahoma,Arial;
}

body{
margin:0;
background:#f1f5f9;
}


.app{
display:flex;
min-height:100vh;
}


.sidebar{

width:260px;
background:#1e3a8a;
color:white;
padding:20px;

}


.sidebar h2{

text-align:center;
margin-bottom:30px;

}


.sidebar button{

width:100%;
padding:13px;
margin-bottom:10px;
border:0;
border-radius:8px;
background:transparent;
color:white;
cursor:pointer;
text-align:right;

}


.sidebar button:hover{

background:#2563eb;

}


.logout{

background:#dc2626!important;

}



.main{

flex:1;
padding:25px;

}



.header{

background:white;
padding:20px;
border-radius:15px;
margin-bottom:20px;

}



#content{

background:white;
padding:25px;
border-radius:15px;

}



.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;

}



.card{

background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px #ddd;
margin-bottom:20px;

}



input,select{

width:100%;
padding:12px;
margin-bottom:10px;
border-radius:8px;
border:1px solid #ccc;

}



.action{

background:#2563eb;
color:white;
border:0;
padding:12px;
border-radius:8px;
cursor:pointer;
width:100%;

}



table{

width:100%;
border-collapse:collapse;

}



th{

background:#1e3a8a;
color:white;
padding:12px;

}


td{

padding:10px;
border-bottom:1px solid #ddd;
text-align:center;

}


</style>

</head>


<body>


<div class="app">



<div class="sidebar">


<h2>
🏫 UCA
</h2>



<button onclick="loadPage('dashboard')">
🏠 الرئيسية
</button>


<button onclick="loadPage('users')">
👥 المستخدمون
</button>


<button onclick="loadPage('plans')">
📂 الخطط
</button>


<button onclick="loadPage('distribution')">
📅 توزيع الأسابيع
</button>


<button onclick="loadPage('reports')">
📊 التقارير
</button>


<button onclick="loadPage('settings')">
⚙ الإعدادات
</button>


<button class="logout" id="logoutBtn">
🚪 تسجيل الخروج
</button>


</div>





<div class="main">


<div class="header">

<h2>
لوحة المدير
</h2>

<div id="adminInfo"></div>

</div>



<div id="content"></div>


</div>



</div>





<script type="module">


import {

protectPage,

currentUser,

logout

}

from "./auth.js";



import {

db

}

from "./firebase-config.js";



import {

ref,

get,

update

}

from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";





protectPage(["Manager"]);





const user=currentUser();



if(user){

adminInfo.innerHTML=

`
${user.name || ""}
<br>
${user.email}
`;

}





logoutBtn.onclick=()=>{

logout();

};








window.loadPage=function(page){


switch(page){


case "dashboard":


content.innerHTML=`

<h2>
الرئيسية
</h2>

<div class="grid">

<div class="card">
<h3>المستخدمون</h3>
<p>إدارة الحسابات والصلاحيات</p>
</div>


<div class="card">
<h3>الخطط</h3>
<p>إدارة الخطط الدراسية</p>
</div>


<div class="card">
<h3>التقارير</h3>
<p>تقارير الأداء</p>
</div>


</div>

`;

break;







case "users":


content.innerHTML=`

<h2>
👥 إدارة المستخدمين
</h2>



<div class="card">


<h3>
إضافة مستخدم
</h3>


<input id="newName"
placeholder="الاسم">


<input id="newEmail"
placeholder="البريد الإلكتروني">


<input id="newPassword"
type="password"
placeholder="كلمة المرور">


<select id="newRole">


<option value="Teacher">
Teacher
</option>


<option value="Head">
Head
</option>


<option value="Coordinator">
Coordinator
</option>


<option value="StageManager">
StageManager
</option>


<option value="Viewer">
Viewer
</option>


<option value="Manager">
Manager
</option>


</select>


<button class="action"
onclick="createNewUser()">

إنشاء المستخدم

</button>


<p id="userMessage"></p>


</div>





<div class="card">


<h3>
المستخدمون الحاليون
</h3>


<table>


<thead>

<tr>

<th>
الاسم
</th>

<th>
البريد
</th>

<th>
الدور
</th>

<th>
الحالة
</th>


</tr>

</thead>


<tbody id="usersTable">

</tbody>


</table>


</div>


`;


loadUsers();


break;







case "plans":


content.innerHTML=

`
<h2>
الخطط الدراسية
</h2>

<p>
رفع وتعديل الخطط
</p>

`;

break;





case "distribution":


content.innerHTML=

`
<h2>
توزيع الأسابيع
</h2>
`;

break;






case "reports":


content.innerHTML=

`
<h2>
التقارير
</h2>
`;

break;





case "settings":


content.innerHTML=

`
<h2>
الإعدادات
</h2>
`;

break;



}


}








window.loadUsers=async function(){



const snap =
await get(
ref(db,"users")
);



usersTable.innerHTML="";



if(!snap.exists()) return;



const data=snap.val();



Object.keys(data).forEach(uid=>{


let u=data[uid];


usersTable.innerHTML +=

`

<tr>


<td>${u.name || ""}</td>


<td>${u.email || ""}</td>


<td>

<select onchange="changeRole('${uid}',this.value)">

<option ${u.role=="Manager"?"selected":""}>
Manager
</option>

<option ${u.role=="Teacher"?"selected":""}>
Teacher
</option>

<option ${u.role=="Head"?"selected":""}>
Head
</option>

<option ${u.role=="Coordinator"?"selected":""}>
Coordinator
</option>

<option ${u.role=="StageManager"?"selected":""}>
StageManager
</option>

<option ${u.role=="Viewer"?"selected":""}>
Viewer
</option>


</select>


</td>



<td>

${u.active ? "فعال":"موقوف"}

</td>


</tr>

`;

});


}







window.changeRole=async function(uid,role){


await update(

ref(db,"users/"+uid),

{

role:role

}

);


alert("تم تعديل الدور");


}






window.createNewUser=function(){


userMessage.innerHTML=

"سيتم تفعيل إنشاء المستخدم بعد تعديل auth.js";

}




loadPage("dashboard");


</script>


</body>

</html>
