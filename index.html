<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
UCA School Management System
</title>


<style>

*{
box-sizing:border-box;
font-family:"Tahoma",Arial,sans-serif;
}


body{

margin:0;

min-height:100vh;

background:
linear-gradient(
135deg,
#0f172a,
#1d4ed8,
#38bdf8
);

display:flex;

align-items:center;

justify-content:center;

}


.login-container{

width:400px;

background:white;

border-radius:20px;

padding:35px;

box-shadow:
0 20px 50px rgba(0,0,0,.3);

}



.logo{

text-align:center;

margin-bottom:30px;

}



.logo .icon{

font-size:55px;

}



.logo h1{

margin:5px;

color:#1e3a8a;

font-size:25px;

}



.logo p{

color:#64748b;

}




.input-group{

margin-bottom:20px;

}



label{

display:block;

margin-bottom:8px;

font-weight:bold;

color:#334155;

}



input{

width:100%;

padding:14px;

border:1px solid #cbd5e1;

border-radius:10px;

font-size:15px;

outline:none;

}



input:focus{

border-color:#2563eb;

}



.password-box{

position:relative;

}



.password-box span{

position:absolute;

left:15px;

top:13px;

cursor:pointer;

font-size:20px;

}




button{

width:100%;

padding:14px;

background:#2563eb;

border:none;

border-radius:10px;

color:white;

font-size:17px;

font-weight:bold;

cursor:pointer;

}



button:hover{

background:#1d4ed8;

}



button:disabled{

background:#94a3b8;

cursor:not-allowed;

}




#message{

margin-top:15px;

text-align:center;

font-size:14px;

color:#dc2626;

min-height:20px;

}




.footer{

text-align:center;

margin-top:25px;

color:#64748b;

font-size:13px;

}



.loading{

display:none;

text-align:center;

margin-top:15px;

color:#2563eb;

}



</style>

</head>



<body>



<div class="login-container">



<div class="logo">


<div class="icon">
🏫
</div>


<h1>
UCA
</h1>


<h1>
School Management System
</h1>


<p>
تسجيل الدخول إلى النظام
</p>


</div>






<div class="input-group">


<label>
البريد الإلكتروني
</label>


<input

id="email"

type="email"

placeholder="name@school.com"

autocomplete="email"

>


</div>







<div class="input-group">


<label>
كلمة المرور
</label>



<div class="password-box">


<input

id="password"

type="password"

placeholder="********"

autocomplete="current-password"

>



<span id="togglePassword">
👁
</span>



</div>


</div>






<button id="loginBtn">

تسجيل الدخول

</button>





<div class="loading" id="loading">

جاري تسجيل الدخول ...

</div>




<div id="message"></div>






<div class="footer">

UCA School Management System © 2026

</div>



</div>








<script type="module">


import {

login

}

from "./auth.js";





const loginButton =
document.getElementById(
"loginBtn"
);



const message =
document.getElementById(
"message"
);



const loading =
document.getElementById(
"loading"
);







loginButton.onclick =
async function(){



message.innerHTML="";

loading.style.display="block";


loginButton.disabled=true;



try{


await login();



}

catch(error){



message.innerHTML =
error.message;


}



finally{


loading.style.display="none";

loginButton.disabled=false;


}



};









// Enter key login


document.addEventListener(
"keydown",
function(e){


if(e.key==="Enter"){


loginButton.click();


}


});









// show password


document
.getElementById("togglePassword")
.onclick=function(){


const password =
document.getElementById(
"password"
);



if(password.type==="password"){


password.type="text";


this.innerHTML="🙈";


}

else{


password.type="password";


this.innerHTML="👁";


}


};




</script>



</body>

</html>
