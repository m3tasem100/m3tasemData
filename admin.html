<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
UCA Admin Dashboard
</title>


<style>

*{
box-sizing:border-box;
font-family:Tahoma,Arial;
}


body{

margin:0;
background:#f1f5f9;

}


/* Layout */

.app{

display:flex;
min-height:100vh;

}



/* Sidebar */

.sidebar{

width:260px;

background:#1e3a8a;

color:white;

padding:20px;

}



.sidebar h2{

text-align:center;

margin-bottom:30px;

}



.sidebar button{

width:100%;

padding:14px;

margin-bottom:10px;

background:transparent;

color:white;

border:0;

border-radius:8px;

text-align:right;

cursor:pointer;

font-size:15px;

}



.sidebar button:hover{

background:#2563eb;

}



/* Main */

.main{

flex:1;

padding:25px;

}



.header{

background:white;

padding:20px;

border-radius:15px;

margin-bottom:20px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 5px 15px #ddd;

}



.logout{

background:#dc2626!important;

}



/* Cards */

.cards{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

gap:20px;

}



.card{

background:white;

padding:25px;

border-radius:15px;

box-shadow:0 5px 15px #ddd;

text-align:center;

}



.card h3{

color:#1e3a8a;

}



#content{

background:white;

border-radius:15px;

padding:25px;

min-height:400px;

}



</style>


</head>


<body>



<div class="app">



<!-- Sidebar -->

<div class="sidebar">


<h2>
🏫 UCA
</h2>



<button onclick="loadPage('dashboard')">
🏠 الرئيسية
</button>


<button onclick="loadPage('users')">
👥 إدارة المستخدمين
</button>



<button onclick="loadPage('plans')">
📂 الخطط الدراسية
</button>



<button onclick="loadPage('distribution')">
📅 توزيع الأسابيع
</button>



<button onclick="loadPage('reports')">
📊 التقارير
</button>



<button onclick="loadPage('settings')">
⚙ الإعدادات
</button>



<button class="logout" id="logoutBtn">

🚪 تسجيل الخروج

</button>



</div>






<!-- Main -->

<div class="main">



<div class="header">


<div>

<h2>
لوحة المدير
</h2>

<span id="adminInfo"></span>

</div>


</div>




<div id="content">


</div>



</div>



</div>








<script type="module">


import {

protectPage,

currentUser,

logout

}

from "./auth.js";



// حماية المدير فقط

protectPage([

"Manager"

]);





const user=currentUser();


if(user){


adminInfo.innerHTML=

`
${user.name || ""}<br>
${user.email}
`;

}





logoutBtn.onclick=()=>{

logout();

};







window.loadPage=function(page){



const content=
document.getElementById("content");



switch(page){



case "dashboard":


content.innerHTML=`

<h2>
الرئيسية
</h2>


<div class="cards">


<div class="card">

<h3>
المستخدمون
</h3>

<p>
إدارة المستخدمين والصلاحيات
</p>

</div>


<div class="card">

<h3>
الخطط
</h3>

<p>
رفع وتوزيع الخطط
</p>

</div>



<div class="card">

<h3>
التقارير
</h3>

<p>
تقارير النظام
</p>

</div>


</div>

`;

break;





case "users":


content.innerHTML=`

<h2>
إدارة المستخدمين
</h2>

<p>
سيتم إضافة إدارة المستخدمين هنا:
</p>

<ul>

<li>إضافة مستخدم</li>

<li>تعديل مستخدم</li>

<li>تغيير الدور</li>

<li>تعطيل المستخدم</li>

</ul>

`;

break;






case "plans":


content.innerHTML=`

<h2>
إدارة الخطط
</h2>

<p>
رفع ملفات الخطط وتعديلها
</p>

`;

break;






case "distribution":


content.innerHTML=`

<h2>
توزيع الأسابيع
</h2>

<p>
توزيع الأهداف على الأسابيع والفصول
</p>

`;

break;







case "reports":


content.innerHTML=`

<h2>
التقارير
</h2>

<p>
تقارير الأداء والإنجاز
</p>

`;

break;







case "settings":


content.innerHTML=`

<h2>
الإعدادات
</h2>

<p>
إعدادات السنة الدراسية والفصول
</p>

`;

break;


}



}





// الصفحة الافتراضية

loadPage("dashboard");



</script>


</body>

</html>
