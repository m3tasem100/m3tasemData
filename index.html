<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
UCA School Management System
</title>


<style>


*{

box-sizing:border-box;

font-family:"Tahoma",Arial,sans-serif;

}



body{

margin:0;

height:100vh;

background:

linear-gradient(

135deg,

#0f172a,

#1d4ed8,

#60a5fa

);


display:flex;

justify-content:center;

align-items:center;


}





.login-box{


width:420px;


background:white;


border-radius:20px;


padding:35px;


box-shadow:

0 20px 50px rgba(0,0,0,.25);


}





.logo{


text-align:center;


margin-bottom:30px;


}





.logo .icon{


font-size:55px;


}



.logo h1{


margin:10px 0;


color:#1e3a8a;


font-size:28px;


}



.logo p{


color:#64748b;


}





.form-group{


margin-bottom:20px;


}



label{


display:block;


margin-bottom:7px;


font-weight:bold;


color:#334155;


}





input{


width:100%;


padding:14px;


border-radius:10px;


border:1px solid #cbd5e1;


font-size:16px;


outline:none;


}





input:focus{


border-color:#2563eb;


box-shadow:0 0 5px #93c5fd;


}







.password-container{


position:relative;


}





.password-container span{


position:absolute;


left:15px;


top:14px;


cursor:pointer;


}





button{


width:100%;


padding:14px;


border:0;


border-radius:12px;


background:#2563eb;


color:white;


font-size:17px;


font-weight:bold;


cursor:pointer;


transition:.3s;


}





button:hover{


background:#1d4ed8;


}






button:disabled{


background:#94a3b8;


cursor:not-allowed;


}





#loader{


display:none;


text-align:center;


margin-top:15px;


color:#2563eb;


}





#message{


margin-top:15px;


text-align:center;


color:#dc2626;


font-weight:bold;


}





.footer{


text-align:center;


margin-top:25px;


font-size:13px;


color:#64748b;


}



</style>


</head>






<body>




<div class="login-box">





<div class="logo">


<div class="icon">

🏫

</div>



<h1>

UCA

</h1>



<h1>

School Management System

</h1>



<p>

تسجيل الدخول إلى النظام

</p>


</div>









<div class="form-group">


<label>

البريد الإلكتروني

</label>



<input

id="email"

type="email"

placeholder="example@school.com"

autocomplete="email"

>


</div>










<div class="form-group">


<label>

كلمة المرور

</label>



<div class="password-container">


<input

id="password"

type="password"

placeholder="********"

autocomplete="current-password"

>



<span id="showPassword">

👁

</span>



</div>



</div>









<button id="loginBtn">


تسجيل الدخول


</button>






<div id="loader">

جاري التحقق...

</div>





<div id="message">

</div>






<div class="footer">


UCA School Management System © 2026


</div>






</div>









<script type="module">


import "./auth.js";





const loginBtn =

document.getElementById(
"loginBtn"
);



const loader =

document.getElementById(
"loader"
);







loginBtn.onclick = async()=>{



loader.style.display="block";


loginBtn.disabled=true;



await window.login();



loader.style.display="none";


loginBtn.disabled=false;



};








// إظهار كلمة المرور


document

.getElementById("showPassword")

.onclick=function(){



const pass =

document.getElementById(
"password"
);



if(pass.type==="password"){



pass.type="text";


this.innerHTML="🙈";


}

else{


pass.type="password";


this.innerHTML="👁";


}


};





</script>




</body>

</html>
