<!DOCTYPE html>

<html lang="ar" dir="rtl">


<head>

<meta charset="UTF-8">

<title>
تقرير تقييم المعلم
</title>


<link rel="stylesheet" href="style.css">


<style>


@media print {


.sidebar,
.print-btn{

display:none;

}


.main{

width:100%;

}


}


.report{


background:white;

padding:30px;

border-radius:15px;


}



</style>



</head>



<body>



<div class="app">


<aside class="sidebar">


<button onclick="window.print()"
class="print-btn">

🖨 طباعة

</button>


<button onclick="history.back()">

⬅ رجوع

</button>


</aside>





<main class="main">


<div class="report">



<h2 style="text-align:center">

تقرير التقييم النهائي للمعلم

</h2>





<hr>





<div id="teacherData">

</div>






<h3>
التقييمات
</h3>



<table>


<thead>


<tr>

<th>
الجهة
</th>


<th>
الوزن
</th>


<th>
الدرجة
</th>


</tr>


</thead>



<tbody id="scores">


</tbody>


</table>







<h3>
النتيجة النهائية

</h3>


<h1 id="finalScore">

</h1>







<h3>
الملاحظات

</h3>


<p id="notes">

</p>






<h3>
مجالات التحسين

</h3>


<p id="improvements">

</p>





</div>



</main>


</div>






<script type="module" src="teacher_evaluation_report.js"></script>


</body>

</html>
