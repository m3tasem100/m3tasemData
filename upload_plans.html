<!DOCTYPE html>

<html lang="ar" dir="rtl">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
توزيع الخطط
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>


<div class="app">



<aside class="sidebar">


<h2>
🏫 UCA
</h2>



<button onclick="backAdmin()">

⬅ لوحة المدير

</button>




<button id="logoutBtn">

🚪 تسجيل الخروج

</button>



</aside>









<main class="main">


<header class="header">


<h2>
توزيع الخطة الأسبوعية
</h2>


</header>







<section class="content">



<div class="card">


<select id="year">

<option>
2025-2026
</option>

</select>





<select id="semester">


<option value="semester1">

الفصل الأول

</option>



<option value="semester2">

الفصل الثاني

</option>


</select>







<select id="grade">

<option>

اختر الصف

</option>

</select>






<select id="subject">

<option>

اختر المادة

</option>


</select>






<button id="loadBtn"

class="btn btn-primary">

تحميل الأهداف

</button>



</div>









<div class="card">


<h3>

الأهداف

</h3>



<table>


<thead>

<tr>


<th>
الهدف

</th>


<th>
عدد الحصص

</th>


<th>
الأسبوع

</th>



</tr>


</thead>





<tbody id="objectivesTable">


</tbody>



</table>



<br>


<button

id="saveBtn"

class="btn btn-success">

حفظ التوزيع


</button>



</div>






</section>


</main>



</div>








<script type="module" src="plan_distribution.js"></script>


</body>

</html>
