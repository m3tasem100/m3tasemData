<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>
التقييم النهائي
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<aside class="sidebar">


<h2>
🏫 UCA
</h2>


<button onclick="history.back()">

⬅ رجوع

</button>


<button id="logoutBtn">

🚪 خروج

</button>


</aside>





<main class="main">


<header class="header">


<h2>
التقييم النهائي للمعلم
</h2>


</header>






<section class="content">


<div class="card">


<select id="teacher">

<option>
اختر المعلم
</option>

</select>



</div>






<div class="card">


<h3>
عناصر التقييم
</h3>



<table>


<thead>

<tr>

<th>
العنصر
</th>

<th>
الدرجة
</th>

<th>
الوزن
</th>

</tr>

</thead>



<tbody id="items">


</tbody>



</table>


</div>








<div class="card">


<h3>
الملاحظات
</h3>


<textarea id="notes"

placeholder="ملاحظات">

</textarea>




<h3>
مجالات التحسين

</h3>


<textarea id="improvements">

</textarea>




<button id="save"

class="btn btn-primary">

حفظ التقييم

</button>


</div>



</section>



</main>


</div>






<script type="module" src="evaluation.js"></script>


</body>


</html>
