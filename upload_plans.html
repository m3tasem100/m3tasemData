<!DOCTYPE html>

<html lang="ar" dir="rtl">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Upload Plans
</title>



<link rel="stylesheet" href="style.css">



</head>





<body>



<div class="main">


<div class="header">


<h2>

📂 رفع الخطط السنوية

</h2>


</div>







<div class="content">






<div class="card">


<h3>
بيانات الخطة
</h3>





<div class="form-group">


<label>
السنة الدراسية
</label>


<select id="year">


<option>
2025-2026
</option>


</select>


</div>








<div class="form-group">


<label>
الفصل الدراسي
</label>



<select id="semester">


<option value="semester1">

الفصل الأول

</option>


<option value="semester2">

الفصل الثاني

</option>


</select>


</div>







<div class="form-group">


<label>
البرنامج
</label>



<select id="program">


<option>

American

</option>



<option>

British

</option>


</select>


</div>









<div class="form-group">


<label>
الصف
</label>


<select id="grade">


<option>
اختر الصف
</option>


</select>


</div>








<div class="form-group">


<label>
المادة
</label>


<select id="subject">


<option>
اختر المادة
</option>


</select>


</div>









<div class="form-group">


<label>

ملف Excel

</label>



<input

type="file"

id="excelFile"

accept=".xlsx,.xls"


>


</div>






<button

class="btn btn-primary"

id="readExcelBtn">

قراءة الملف

</button>



</div>









<div class="card">


<h3>
معاينة البيانات

</h3>



<div class="table-container">


<table>


<thead>


<tr id="excelHeader">


</tr>


</thead>



<tbody id="excelBody">


</tbody>


</table>



</div>



</div>







<button

class="btn btn-success"

id="savePlanBtn"

style="display:none">


حفظ الخطة

</button>






<p id="message"></p>






</div>


</div>









<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>



<script type="module" src="plans.js"></script>



</body>


</html>
