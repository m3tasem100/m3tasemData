<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
رفع الخطط السنوية
</title>


<style>

body{

font-family:Tahoma;
background:#f3f4f6;
padding:20px;

}


.card{

background:white;
padding:25px;
border-radius:10px;
box-shadow:0 3px 10px #ddd;

max-width:800px;
margin:auto;

}


input,select{

width:100%;
padding:10px;
margin:8px 0;

}



button{

background:#2563eb;
color:white;
padding:12px 20px;
border:0;
border-radius:6px;
cursor:pointer;

}



table{

width:100%;
border-collapse:collapse;
margin-top:20px;

}


td,th{

border:1px solid #ddd;
padding:8px;

}


th{

background:#2563eb;
color:white;

}


</style>


</head>



<body>



<div class="card">


<h2>
رفع الخطة السنوية
</h2>



<label>
السنة
</label>

<select id="year">

<option>
2025-2026
</option>

</select>




<label>
الفصل
</label>

<select id="semester">

<option>
Semester 1
</option>

<option>
Semester 2
</option>

</select>





<label>
البرنامج
</label>

<select id="program">

<option>
American
</option>


<option>
British
</option>


</select>





<label>
القسم
</label>


<input id="section"
placeholder="Secondary">





<label>
الصف
</label>


<input id="grade"
placeholder="Grade 9">





<label>
المادة
</label>


<input id="subject"
placeholder="Computer Science">





<hr>



<input 
type="file"
id="excelFile"
accept=".xlsx,.xls">





<button id="upload">

رفع الملف

</button>



<p id="message"></p>



<div id="preview"></div>


</div>






<script type="module">


import {

getDatabase,
ref,
push,
set

}

from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";



import {

protectPage

}

from "./auth.js";



protectPage([
"Manager"
]);






// مكتبة Excel

import * as XLSX

from

"https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs";





const db=getDatabase();






document
.getElementById("upload")
.onclick=uploadPlan;








async function uploadPlan(){



const file=

document
.getElementById("excelFile")
.files[0];




if(!file){

alert(
"اختر ملف Excel"
);

return;

}




const requiredColumns=[

"Section",

"Grade level",

"Subject",

"Chapter",

"Lesson",

"Outcome code",

"Outcome description",

"Semester",

"Week"

];






const buffer=
await file.arrayBuffer();





const workbook=
XLSX.read(
buffer
);



const sheet=
workbook.Sheets[
workbook.SheetNames[0]
];



const data=
XLSX.utils.sheet_to_json(sheet);





if(data.length===0){

alert(
"الملف فارغ"
);

return;

}






// التحقق من الأعمدة


let columns=
Object.keys(data[0]);



let missing=
requiredColumns.filter(
c=>!columns.includes(c)
);





if(missing.length){


document
.getElementById("message")
.innerHTML=

"الأعمدة الناقصة: "
+
missing.join(",");


return;


}








let planId=
push(
ref(db,"plans")
).key;






let plan={



year:
document.getElementById("year").value,


semester:
document.getElementById("semester").value,


program:
document.getElementById("program").value,


section:
document.getElementById("section").value,


grade:
document.getElementById("grade").value,


subject:
document.getElementById("subject").value,



weeks:{}



};








data.forEach(row=>{


let week=
row["Week"];




if(!plan.weeks[week]){


plan.weeks[week]={

lessons:[]

};


}







plan.weeks[week]
.lessons
.push({

chapter:
row["Chapter"],


lesson:
row["Lesson"],


outcomeCode:
row["Outcome code"],


description:
row["Outcome description"],


verified:false


});



});








await set(

ref(
db,
"plans/"+planId
),

plan


);






document
.getElementById("message")
.innerHTML=

`
تم رفع الخطة بنجاح

عدد الصفوف:
${data.length}

`;





showPreview(data);



}









function showPreview(data){



let html=

`

<table>

<tr>

<th>
الأسبوع
</th>


<th>
المادة
</th>


<th>
الهدف
</th>


</tr>

`;



data.slice(0,10)
.forEach(r=>{


html+=`

<tr>

<td>
${r["Week"]}
</td>


<td>
${r["Subject"]}
</td>


<td>
${r["Outcome description"]}
</td>


</tr>

`;


});



html+="</table>";



document
.getElementById("preview")
.innerHTML=html;



}



</script>



</body>

</html>
