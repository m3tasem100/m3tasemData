<!DOCTYPE html>

<html lang="ar" dir="rtl">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
رفع الخطط
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>


<div class="app">


<aside class="sidebar">


<h2>
🏫 UCA
</h2>


<button onclick="backAdmin()">

⬅ لوحة المدير

</button>



<button id="logoutBtn">

🚪 تسجيل الخروج

</button>


</aside>









<main class="main">


<header class="header">

<h2>
رفع الخطط الدراسية
</h2>

</header>






<section class="content">



<div class="card">



<select id="year">


<option>
2025-2026
</option>


</select>





<select id="semester">


<option value="semester1">
الفصل الأول
</option>



<option value="semester2">
الفصل الثاني
</option>


</select>






<select id="program">


<option value="American">

American

</option>



<option value="British">

British

</option>


</select>







<select id="grade">


<option>
اختر الصف

</option>


</select>







<select id="subject">


<option>
اختر المادة

</option>


</select>








<input

type="file"

id="excelFile"

accept=".xlsx,.xls">


<br><br>


<button

id="uploadBtn"

class="btn btn-primary">

رفع الخطة


</button>



</div>







<div class="card">


<h3>
نتيجة الرفع

</h3>


<div id="result">

</div>


</div>





</section>



</main>




</div>








<script type="module" src="upload_plans.js"></script>


</body>


</html>
