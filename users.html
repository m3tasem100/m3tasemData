<!DOCTYPE html>

<html lang="ar" dir="rtl">


<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
إدارة المستخدمين
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>


<div class="app">


<aside class="sidebar">


<h2>
🏫 UCA
</h2>


<button onclick="goAdmin()">

⬅ العودة للوحة المدير

</button>


<button id="logoutBtn">

🚪 تسجيل الخروج

</button>


</aside>







<main class="main">


<header class="header">


<h2>
إدارة المستخدمين
</h2>


</header>





<section class="content">



<div class="card">


<h3>
إضافة مستخدم
</h3>



<input id="name"
placeholder="الاسم">



<input id="email"
placeholder="البريد">



<select id="role">


<option value="Manager">
مدير
</option>


<option value="Head">
رئيس قسم
</option>


<option value="Coordinator">
منسق
</option>


<option value="StageManager">
مدير مرحلة
</option>


<option value="Teacher">
معلم
</option>


<option value="Viewer">
مشاهد
</option>


</select>





<select id="active">


<option value="true">
فعال
</option>


<option value="false">
معطل
</option>


</select>





<button id="addBtn"
class="btn btn-primary">

إضافة

</button>


</div>










<div class="card">


<h3>
المستخدمون

</h3>




<table>


<thead>

<tr>

<th>
الاسم
</th>


<th>
البريد
</th>


<th>
الدور
</th>


<th>
الحالة
</th>


<th>
إجراءات
</th>


</tr>


</thead>



<tbody id="usersTable">


</tbody>


</table>


</div>





</section>




</main>


</div>






<script type="module" src="users.js"></script>


</body>


</html>
