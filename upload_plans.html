<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<title>
رفع الخطط الدراسية
</title>


<link rel="stylesheet" href="style.css">


</head>


<body>


<div class="app">


<aside class="sidebar">


<h2>
🏫 UCA
</h2>


<button onclick="backAdmin()">
⬅ لوحة المدير
</button>


<button id="logoutBtn">
🚪 خروج
</button>


</aside>






<main class="main">


<header class="header">

<h2>
رفع الخطط السنوية
</h2>

</header>







<section class="content">



<div class="card">


<select id="year">

<option>
اختر السنة
</option>


<option value="2025-2026">
2025-2026
</option>


</select>







<select id="semester">


<option value="semester1">
الفصل الأول
</option>


<option value="semester2">
الفصل الثاني
</option>


</select>









<select id="program">


<option value="American">
American Program
</option>


<option value="British">
British Program
</option>


</select>








<select id="grade">

<option>
اختر الصف
</option>


<option value="grade9">
Grade 9
</option>


<option value="grade10">
Grade 10
</option>


</select>








<input id="subject"

placeholder="المادة">




<input type="file"

id="file"

accept=".xlsx,.xls">





<button id="uploadBtn"

class="btn btn-primary">

رفع الخطة

</button>


</div>








<div class="card">


<h3>
معاينة البيانات
</h3>


<table>


<thead>


<tr>

<th>
الوحدة
</th>


<th>
الهدف
</th>


<th>
الحصص
</th>


<th>
الأسبوع
</th>


</tr>


</thead>



<tbody id="preview">

</tbody>


</table>


</div>





</section>



</main>



</div>








<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>


<script type="module" src="upload_plans.js"></script>


</body>


</html>
