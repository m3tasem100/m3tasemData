<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
UCA Admin Dashboard
</title>


<link rel="stylesheet" href="style.css">


</head>



<body>


<div class="app">



<!-- ======================
     SIDEBAR
======================= -->


<aside class="sidebar">


<div class="logo">

<h2>
🏫 UCA
</h2>

<p>
School Management
</p>

</div>




<button onclick="loadModule('dashboard')">

🏠 الرئيسية

</button>




<button onclick="loadModule('users')">

👥 إدارة المستخدمين

</button>





<button onclick="loadModule('departments')">

🏢 الأقسام

</button>





<button onclick="loadModule('subjects')">

📚 المواد

</button>





<button onclick="loadModule('grades')">

🎓 الصفوف والشعب

</button>





<button onclick="loadModule('plans')">

📂 الخطط الدراسية

</button>





<button onclick="loadModule('distribution')">

📅 توزيع الأسابيع

</button>





<button onclick="loadModule('reports')">

📊 التقارير

</button>





<button onclick="loadModule('settings')">

⚙ الإعدادات

</button>





<button id="logoutBtn" class="logout">

🚪 تسجيل الخروج

</button>



</aside>










<!-- ======================
       MAIN
======================= -->


<main class="main">



<header class="header">


<div>


<h2>

لوحة المدير

</h2>


<p id="userInfo">

</p>


</div>




<div>


<span id="date">

</span>


</div>



</header>







<section id="content" class="content">


</section>




</main>





</div>






<script type="module" src="admin.js"></script>



</body>


</html>
