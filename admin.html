<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
لوحة المدير
</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">



<!-- Sidebar -->

<aside class="sidebar">


<div class="logo">

<h2>
🏫 UCA
</h2>


<p>
نظام الإدارة المدرسية
</p>


</div>





<button onclick="openPage('admin_dashboard.html')">

🏠 الرئيسية

</button>





<button onclick="openPage('users.html')">

👥 إدارة المستخدمين

</button>





<button onclick="openPage('departments.html')">

🏢 الأقسام

</button>

<button onclick="openPage('academic_years.html')">

📅 السنوات والفصول

</button>



<button onclick="openPage('subjects.html')">

📚 المواد

</button>





<button onclick="openPage('grades.html')">

🎓 الصفوف

</button>





<button onclick="openPage('teacher_assignment.html')">

👨‍🏫 ربط المعلمين

</button>





<button onclick="openPage('upload_plans.html')">

📂 رفع الخطط

</button>





<button onclick="openPage('plan_distribution.html')">

📅 توزيع الأسابيع

</button>


<button onclick="openPage('evaluation_items.html')">

⚙️ عناصر التقييم

</button>


<button onclick="openPage('reports.html')">

📊 التقارير

</button>





<button onclick="openPage('settings.html')">

⚙️ الإعدادات

</button>






<hr>





<button id="logoutBtn"
class="logout">

🚪 تسجيل الخروج

</button>



</aside>









<!-- Main -->


<main class="main">


<header class="header">


<h2>

لوحة المدير

</h2>



<div id="adminInfo">

</div>


</header>









<section class="content">



<div class="cards">





<div class="card"
onclick="openPage('users.html')">


<h3>
👥 المستخدمون
</h3>


<p>
إضافة وتعديل الصلاحيات
</p>


</div>







<div class="card"
onclick="openPage('teacher_assignment.html')">


<h3>
👨‍🏫 المعلمون
</h3>


<p>
ربط المواد والصفوف
</p>


</div>







<div class="card"
onclick="openPage('upload_plans.html')">


<h3>
📂 الخطط
</h3>


<p>
رفع الخطط الدراسية
</p>


</div>







<div class="card"
onclick="openPage('plan_distribution.html')">


<h3>
📅 التوزيع الأسبوعي
</h3>


<p>
توزيع الأهداف
</p>


</div>







<div class="card"
onclick="openPage('admin_dashboard.html')">


<h3>
📊 التقارير
</h3>


<p>
إحصائيات النظام
</p>


</div>







</div>







</section>




</main>




</div>









<script type="module">


import {

protectPage,
currentUser,
logout

}

from "./auth.js";







// حماية المدير


protectPage([

"Manager"

]);







const user = currentUser();







if(user){



document

.getElementById(

"adminInfo"

)

.innerHTML=


`

<strong>
${user.name}
</strong>

<br>

${user.email}

<br>

<span>

${user.role}

</span>

`;



}







document

.getElementById(

"logoutBtn"

)

.onclick=

logout;







window.openPage=function(page){



location.href=page;


};






</script>




</body>

</html>
